name: build

# Releases are made from the "release" branch only:
#  - every push to "release" builds the Linux, Windows and macOS packages and publishes them
#    as a GitHub Release tagged v<version>, the version being read from flow5-lib/api/fl5core.h;
#  - the push is rejected (the run fails before building) if that version is not higher than
#    the latest v* release tag, i.e. MAJOR_VERSION/MINOR_VERSION must be increased for each release;
#  - pull requests into "release" run the version check only, so that it can be made a required check;
#  - a manual run (Actions > build > Run workflow, any branch) builds the three packages as artifacts
#    for testing, without publishing a release; the version check only reports the version.
# No other push, tag or pull request is built.
on:
  push:
    branches: ["release"]
  pull_request:
    branches: ["release"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release half-way

jobs:
  version:
    name: Version check
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # all tags, to find the latest release

      - name: Check that the version was increased
        id: check
        run: |
          VERSION="$(packaging/version.sh)"
          IFS=. read -r MAJ MIN <<<"$VERSION"
          latest=""; lmaj=-1; lmin=-1
          for t in $(git tag -l 'v*'); do
            if [[ $t =~ ^v([0-9]+)\.([0-9]+)$ ]]; then
              a=$((10#${BASH_REMATCH[1]})); b=$((10#${BASH_REMATCH[2]}))
              if (( a>lmaj || (a==lmaj && b>lmin) )); then lmaj=$a; lmin=$b; latest=$t; fi
            fi
          done
          if [[ -n "$latest" ]] && ! (( 10#$MAJ>lmaj || (10#$MAJ==lmaj && 10#$MIN>lmin) )) \
             && [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "::notice title=Test build::version $VERSION is not higher than the latest release $latest; fine for a test build, which does not publish anything"
          elif [[ -n "$latest" ]] && ! (( 10#$MAJ>lmaj || (10#$MAJ==lmaj && 10#$MIN>lmin) )); then
            echo "::error title=Version not increased::fl5core.h defines version $VERSION, which is not higher than the latest release $latest. Increase MAJOR_VERSION/MINOR_VERSION in flow5-lib/api/fl5core.h before pushing to the release branch."
            exit 1
          fi
          echo "Releasing v$VERSION (previous release: ${latest:-none})"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux AppImage
    needs: version
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache   # ccache lives here (see docker/dev.sh)
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Same image as for local development. Layers are cached in the GitHub
      # Actions cache, so OCCT/gmsh are only recompiled when the Dockerfile changes.
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: docker
          tags: flow5-build:latest
          load: true
          cache-from: type=gha,scope=flow5-linux-image
          cache-to: type=gha,scope=flow5-linux-image,mode=max

      - name: ccache
        uses: actions/cache@v4
        with:
          path: .cache/flow5-ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Build and package
        run: |
          export VERSION="${{ needs.version.outputs.version }}"
          packaging/ci-run.sh ./docker/dev.sh appimage

      - uses: actions/upload-artifact@v4
        with:
          name: flow5-linux
          path: build/dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: version
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # Prebuilt MinGW-w64 packages: Qt, OpenCascade, gmsh, OpenBLAS - nothing but
      # flow5 itself is compiled.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip
          pacboy: >-
            gcc:p make:p lld:p
            qt6-base:p qt6-svg:p qt6-imageformats:p qt6-tools:p
            opencascade:p gmsh:p openblas:p

      # The MSYS2 nsis package lacks the plugin DLLs used by the installer's Modern UI pages:
      # use the official NSIS, preinstalled on some runner images, otherwise from Chocolatey.
      - name: Install NSIS
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { choco install nsis -y --no-progress }
          & $makensis /VERSION

      - name: Build and package
        env:
          MAKENSIS: C:\Program Files (x86)\NSIS\makensis.exe
        run: |
          export VERSION="${{ needs.version.outputs.version }}"
          packaging/ci-run.sh packaging/windows/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: flow5-windows
          path: |
            build/dist/*.exe
            build/dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS dmg (arm64)
    needs: version
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      # Prebuilt arm64 bottles: Qt, OpenCascade, gmsh. BLAS/LAPACK = Accelerate.
      - name: Install dependencies
        run: brew install qtbase qtsvg qtimageformats opencascade gmsh

      - name: Build and package
        run: |
          export VERSION="${{ needs.version.outputs.version }}"
          packaging/ci-run.sh packaging/macos/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: flow5-macos
          path: build/dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: flow5-*          # skip the docker build record artifact
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}     # created on the pushed commit
          target_commitish: ${{ github.sha }}
          name: flow5 v${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
